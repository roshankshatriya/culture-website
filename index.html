<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Sanskriti — Celebrating the timeless beauty of Indian Classical Arts: Bharatanatyam, Kathak, Carnatic Music, and Cultural Performances." />
  <title>Madhurya Manjari — Home | Indian Classical Arts</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

  <!-- ===== SPLASH SCREEN ===== -->
  <section class="splash-screen">

    <!-- Outer gap / decorative border frame -->
    <div class="splash-frame">

      <!--
        VIDEO — 1080p full visual, muted (required for browser autoplay policy).
        The music comes from the separate <audio> element below.
      -->
      <video
        id="splash-video"
        class="splash-video-bg"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >
        <source src="images/home/video for website starting page.mp4" type="video/mp4" />
      </video>

      <!--
        AUDIO — aud-majari.mp4 contains the music track.
        Starts muted; JS unmutes it on the first user gesture (browser policy).
      -->
      <audio id="splash-audio" loop preload="auto" autoplay>
        <source src="images/home/aud-majari.mp4" type="video/mp4" />
      </audio>

      <!-- Dark gradient overlay so text/button stay readable -->
      <div class="splash-dark-overlay"></div>

      <!-- Subtle golden radial glow overlay -->
      <div class="splash-light-overlay"></div>

      <!-- Content centred on top of video -->
      <div class="splash-content">
        <!-- <img src="images/home/madhura-manjari-logo.png" alt="Madhurya Manjari" class="splash-logo" /> -->
        <h2 class="sanskrit-welcome"></h2>
        <a href="home.html" class="btn btn-primary splash-btn" id="enterBtn">
          <span>सुस्वागतम्</span>
          <span>Welcome</span>
        </a>
      </div>

    </div><!-- /.splash-frame -->

  </section>

  <script>
    (function () {
      const video = document.getElementById('splash-video');
      const audio = document.getElementById('splash-audio');

      // --- Start video (muted — always allowed) ---
      video.play().catch(() => {});

      // --- Try starting audio immediately (in case autoplay is permitted) ---
      audio.muted = false;
      audio.volume = 0.75;
      audio.play().catch((err) => {
        console.log('Autoplay blocked. Audio will play on first user interaction.');
      });

      // --- On first user gesture anywhere: play music if blocked ---
      function startMusic() {
        if (audio.paused) {
          audio.muted = false;
          audio.volume = 0.75;
          audio.play().catch((err) => {
            console.warn('Audio play blocked:', err);
          });
        }

        document.removeEventListener('click',      startMusic);
        document.removeEventListener('touchstart', startMusic);
        document.removeEventListener('keydown',    startMusic);
      }

      document.addEventListener('click',      startMusic, { once: true });
      document.addEventListener('touchstart', startMusic, { once: true });
      document.addEventListener('keydown',    startMusic, { once: true });

      // Belt-and-suspenders loop for video
      video.addEventListener('ended', () => video.play());
    })();
  </script>

</body>

</html>
